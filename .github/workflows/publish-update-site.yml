name: Publish EDT update site

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - website/**
      - scripts/prepare-update-site.py
      - .github/workflows/publish-update-site.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the latest published installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release
          for attempt in 1 2 3 4 5 6; do
            if gh release download --pattern 'GitFlow-*.zip' --dir release --clobber; then
              break
            fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 10
          done
      - name: Prepare and validate the p2 repository
        run: |
          mapfile -t archives < <(find release -maxdepth 1 -name 'GitFlow-*.zip')
          test "${#archives[@]}" -eq 1
          python3 scripts/prepare-update-site.py "${archives[0]}" _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
